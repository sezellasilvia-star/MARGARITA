<style>
:root{--bg:#f4f1ec;--card:#fff;--tx:#2b2622;--mut:#7a6f66;--ac:#5a9e6f;--bd:#ddd5ca;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a17;--card:#2a2623;--tx:#f0ebe4;--mut:#a89d92;--ac:#79bd8c;--bd:#463f39}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif}
.w{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0 0 2px}p.s{margin:0 0 12px;color:var(--mut);font-family:system-ui,sans-serif;font-size:.9rem}
.stage{position:relative;height:380px;overflow:hidden;border-radius:16px;border:1px solid var(--bd);background:linear-gradient(var(--card),var(--bg))}
.floor{position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--bd);opacity:.6}
#av{position:absolute;bottom:8px;left:-30%;width:200px;height:370px;transition:left 3.6s linear}
#av svg{width:100%;height:100%;overflow:visible}
.arm,.leg{transition:transform .3s}
.walk .lL{animation:sw .7s ease-in-out infinite alternate;transform-origin:130px 300px}
.walk .lR{animation:sw .7s ease-in-out infinite alternate-reverse;transform-origin:170px 300px}
.walk .aL{animation:sw .7s ease-in-out infinite alternate-reverse;transform-origin:105px 168px}
.walk .aR{animation:sw .7s ease-in-out infinite alternate;transform-origin:195px 168px}
@keyframes sw{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.talk .aL{animation:ga 1.3s ease-in-out infinite;transform-origin:105px 168px}
.talk .aR{animation:gb 1.7s ease-in-out infinite;transform-origin:195px 168px}
@keyframes ga{0%,100%{transform:rotate(0)}50%{transform:rotate(-38deg)}}
@keyframes gb{0%,100%{transform:rotate(0)}50%{transform:rotate(34deg)}}
.talk #head{animation:nod 2s ease-in-out infinite;transform-origin:150px 150px}
@keyframes nod{50%{transform:rotate(1.6deg)}}
.eye{animation:bl 4.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes bl{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bar{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
input{flex:1;min-width:180px;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem}
button{padding:11px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:.95rem;cursor:pointer}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.rec{background:#c0392b;color:#fff;border-color:#c0392b}
select{padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}
#log{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;min-height:70px;font-size:1rem;line-height:1.5;white-space:pre-wrap}
#st{font-family:system-ui,sans-serif;font-size:.8rem;color:var(--mut);margin-top:6px}
</style></head><body><div class="w">
<h1>Margarita</h1><p class="s">Humana digital · responde sobre “Mi recorrido en las Prácticas”</p>

</svg></div></div>
<div class="bar"><button id="bw">🚶 Caminar</button><button id="bp" class="p">▶ Escuchar el discurso</button><button id="bs">■ Parar</button><select id="vs" title="Voz"></select></div>
<div class="bar"><input id="q" placeholder="Pregúntale a Margarita…"><button id="bm">🎤 Hablar</button><button id="ba" class="p">Preguntar</button></div>
<div id="log">Hola, soy Margarita. Preguntame sobre el recorrido de Esther en las Prácticas Docentes.</div><div id="st"></div>
</div>
<script>
const D=`Mi recorrido en las Practicas. Buenas tardes, mi nombre es Esther. Quiero compartirles mi recorrido en las Practicas Docentes, un camino que fue de a poco, de la observación a hacerme cargo sola del aula.
En Práctica I realizamos observaciones de clase, en grupo de tres integrantes. Fue el primer acercamiento a la escuela, mirar, escuchar, conocer como es el aula.
En Práctica II hicimos observaciones y ayudantías con pareja pedagógica. Ahí ya no solo mirábamos, sino que empezamos a ayudar, a acompañar al docente y a los estudiantes.
En Práctica III realizamos observaciones, ayudantías y dimos clases con pareja pedagógica. Trabajamos la comprensión lectora a través de la lectura de la novela “El misterio de Crantock” de Sergio Aguirre. Esta obra pertenece a la Literatura Infantil y Juvenil argentina, al genero narrativo. Es una novela fantástica, de misterio y suspenso. Trabajé con la conceptualización de la novela, y la diferencia entre el cuento y la novela. Ahí aprendí que para que un estudiante lea, primero tiene que tener ganas de saber que pasa después.
En Práctica IV y Residencia el trabajo fue individual, en dos etapas, la primera en la Escuela Técnica numero 10, y la segunda en la Escuela Normal. En la primera etapa, en el curso 6to IV trabajé con la obra literaria “Colgado de los tobillos”, del autor Van Bredam, en la comprensión lectora, el narrador y la focalización. Es decir, no solo qué se cuenta, sino quién lo cuenta y desde donde lo cuenta. También trabajé el texto explicativo: sus recursos, el informe de investigación y la monografía, sus estructuras.
En la segunda etapa de la Residencia, trabajé sobre la literatura gauchesca: sus características, orígenes. Leímos y analizamos la primera parte del libro “El gaucho Martín Fierro”, de José Hernández, con el tema de la denuncia social. Utilicé una selección de cantos e imágenes ampliadas relacionadas con esos cantos, que funcionaron como mediadoras de la lectura. También trabajamos la intertextualidad: hipotexto e hipertexto, es decir, cómo un texto se escribe a partir de otro texto. El hipotexto fue “El Martín Fierro”, de José Hernández. Y los hipertextos fueron los cuentos “El fin” y “Biografía de Tadeo Isidoro Cruz”, de Jorge Luis Borges.
Con eso les demostré a los estudiantes que Fierro no terminó en Hernández. Que Borges lo retoma, lo reescribe, le da otra voz, y que la literatura es un dialogo entre autores. Y relacionamos la denuncia social de Fierro con el entorno de los estudiantes: el trabajo precario, la desigualdad, el abandono del Estado.
Si miro todo mi recorrido, veo un crecimiento: en Práctica I aprendí a observar, en Practica II a ayudar, en Practica III a dar clase acompañada y a despertar el deseo de leer, y en Practica IV a hacerme cargo sola del aula, a enseñar a leer críticamente, a reconocer cómo los textos dialogan entre sí, y a escribir textos explicativos con su estructura.`;
const $=i=>document.getElementById(i),av=$('av'),mo=$('mo'),lip=$('lip'),log=$('log'),st=$('st'),q=$('q');
let sample=null,dict=null,talking=false,iv=null,voice=null;
const FEM=/female|mujer|paulina|monica|mónica|helena|sabina|elena|laura|elvira|dalia|paloma|marisol|luciana|soledad|angelica|francisca|isabela|camila|valentina|sofia|google/i,MAL=/(^|[\s(-])male|pablo|raul|raúl|jorge|diego|juan|carlos|enrique|miguel|alvaro|álvaro|jaime|andres|andrés|tomas|tomás|gonzalo|alberto|jose|josé/i;let vsl=[];
function setV(){const all=speechSynthesis.getVoices().filter(x=>/^es/i.test(x.lang));const s=$('vs');if(!all.length){s.style.display='none';return}
const pk=all.filter(x=>!MAL.test(x.name)),pool=pk.length?pk:all,prev=s.value;vsl=all;s.textContent='';
all.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name;s.appendChild(o)});
const best=pool.find(x=>FEM.test(x.name)&&/AR|MX|419|US/i.test(x.lang))||pool.find(x=>FEM.test(x.name))||pool[0];
s.value=s.dataset.u?prev:all.indexOf(best);voice=all[s.value];s.onchange=()=>{s.dataset.u=1;voice=vsl[s.value]}}
if('speechSynthesis' in window){setV();speechSynthesis.onvoiceschanged=setV}
function mouth(on){clearInterval(iv);if(!on){mo.setAttribute('ry',2);lip.style.opacity=1;return}
iv=setInterval(()=>{const r=talking?2+Math.random()*9:2;mo.setAttribute('ry',r);lip.style.opacity=r>4?0:1},110)}
function stop(){speechSynthesis.cancel();talking=false;mouth(false);av.classList.remove('talk')}
function say(t){stop();setTimeout(()=>say2(t),200)}
function say2(t){if(!('speechSynthesis' in window)){st.textContent='Tu navegador no tiene voz. Abrí el enlace en Chrome o Edge.';return}setV();const parts=t.match(/[^.!?\n]+[.!?]*/g)||[t];let n=0;st.textContent=voice?'Voz: '+voice.name:'No encontré voz en español en este dispositivo; uso la voz predeterminada.';speechSynthesis.resume();
av.classList.add('talk');talking=true;mouth(true);
parts.forEach((p,i)=>{if(!p.trim())return;const u=new SpeechSynthesisUtterance(p.trim());u.lang='es-AR';if(voice)u.voice=voice;u.rate=.98;u.pitch=voice&&FEM.test(voice.name)?1.1:1.3;u.volume=1;n++;
u.onend=()=>{if(--n<=0)stop()};u.onerror=e=>{st.textContent='Error de audio: '+(e.error||'desconocido')+'. Subí el volumen o abrí el enlace en Chrome/Edge.';if(--n<=0)stop()};speechSynthesis.speak(u)});if(!n)stop()}
function walk(){av.style.transition='none';av.style.left='-30%';void av.offsetWidth;av.style.transition='left 3.6s linear';
av.classList.add('walk');av.style.left='calc(50% - 100px)';setTimeout(()=>av.classList.remove('walk'),3700)}
function local(qs){const w=qs.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').match(/\w{4,}/g)||[];
const s=D.match(/[^.!?\n]+[.!?]*/g);const sc=s.map(x=>{const l=x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');return[w.filter(k=>l.includes(k)).length,x.trim()]}).sort((a,b)=>b[0]-a[0]);
return sc[0][0]?sc.slice(0,2).map(x=>x[1]).join(' '):'No encuentro eso en el discurso de Esther. Preguntame sobre sus prácticas, las obras que trabajó o su crecimiento.'}
async function ask(){const t=q.value.trim();if(!t)return;log.textContent='Pregunta: '+t+'\n\nMargarita pensando…';st.textContent='';let a;
try{if(!sample)sample=await claude.use('sample');
if(sample){const r=await sample([{role:'user',content:'Eres Margarita, una humana digital amable que habla en español rioplatense en primera persona del plural o como narradora del discurso de Esther. Responde SOLO con base en este discurso; si la respuesta no está, dilo brevemente. Máximo 3 oraciones, sin listas ni markdown.\n\nDISCURSO:\n'+D+'\n\nPREGUNTA: '+t}],{cache:false});a=r.text}}catch(e){a=null}
if(!a){a=local(t);st.textContent='Respuesta aproximada (búsqueda local en el discurso).'}
log.textContent='Pregunta: '+t+'\n\n'+a;say(a)}
$('bw').onclick=walk;$('bp').onclick=()=>{log.textContent=D;say(D)};$('bs').onclick=stop;$('ba').onclick=ask;q.onkeydown=e=>{if(e.key==='Enter')ask()};
const bm=$('bm');let rec=null;
function mic(on){bm.classList.toggle('rec',on);bm.textContent=on?'■ Escuchando…':'🎤 Hablar'}
bm.onclick=async()=>{
if(bm.classList.contains('rec')){if(dict)dict.stop();if(rec)rec.stop();mic(false);return}
stop();q.value='';
try{if(dict===null)dict=(await claude.use('dictation'))||false;
if(dict){dict.onPartial(({text})=>q.value=text);dict.onFinal(({text})=>{q.value=text;mic(false);ask()});dict.onState(({state})=>{if(state==='idle')mic(false)});await dict.start();mic(true);return}}catch(e){}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){st.textContent='Tu navegador no permite micrófono aquí. Escribí tu pregunta.';return}
rec=new SR();rec.lang='es-AR';rec.interimResults=true;
rec.onresult=e=>{q.value=[...e.results].map(r=>r[0].transcript).join('')};
rec.onend=()=>{mic(false);if(q.value.trim())ask()};rec.onerror=()=>{mic(false);st.textContent='No pude acceder al micrófono. Revisá los permisos o escribí tu pregunta.'};
try{rec.start();mic(true)}catch(e){mic(false)}};
setTimeout(walk,300);
</script></body></html>
